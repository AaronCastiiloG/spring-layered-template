spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/template_db}
spring.datasource.username=${DB_USERNAME:admin}
spring.datasource.password=${DB_PASSWORD:12345}

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

app.jwt.secret=${JWT_SECRET:local-dev-only-secret-key-min-32b}
app.seed.enabled=true
app.seed.admin-username=${APP_ADMIN_USERNAME:admin}
app.seed.admin-password=${APP_ADMIN_PASSWORD:admin}
app.seed.user-username=${APP_USER_USERNAME:user}
app.seed.user-password=${APP_USER_PASSWORD:user}
